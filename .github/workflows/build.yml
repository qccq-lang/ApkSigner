name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    # 关键修复步骤：如果仓库没有该密钥，则自动生成一个 my-upload-key.jks 供 Gradle 打包使用
    - name: Prepare Release Keystore
      run: |
        if [ ! -f my-upload-key.jks ]; then
          echo "Generating temporary my-upload-key.jks for release packaging..."
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ApkSigner, OU=Android, O=OpenSource, L=Unknown, S=Unknown, C=US"
        fi

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
