name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    # 1. 准备签名文件及写入全部常用的密码属性
    - name: Prepare Keystore and Release Properties
      run: |
        # 生成签名文件，密码统一设置为 android，别名为 upload
        if [ ! -f my-upload-key.jks ]; then
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ApkSigner, OU=Android, O=OpenSource, L=Unknown, S=Unknown, C=US"
        fi

        # 注入所有常见的密码变量到 gradle.properties，防止 build.gradle 读取不到
        mkdir -p ~/.gradle
        cat << 'EOF' >> ~/.gradle/gradle.properties
        storeFile=../my-upload-key.jks
        storePassword=android
        keyPassword=android
        keyAlias=upload
        KEYSTORE_PASSWORD=android
        KEY_PASSWORD=android
        KEY_ALIAS=upload
        RELEASE_STORE_PASSWORD=android
        RELEASE_KEY_PASSWORD=android
        RELEASE_KEY_ALIAS=upload
        MYAPP_UPLOAD_STORE_PASSWORD=android
        MYAPP_UPLOAD_KEY_PASSWORD=android
        MYAPP_UPLOAD_KEY_ALIAS=upload
        EOF
        cp ~/.gradle/gradle.properties ./gradle.properties

    # 2. 同时通过环境变量和命令行参数传参，确保 100% 覆盖 build.gradle 的各种读取方式
    - name: Build Release APK
      env:
        STORE_PASSWORD: android
        KEY_PASSWORD: android
        KEY_ALIAS: upload
        KEYSTORE_PASSWORD: android
        RELEASE_STORE_PASSWORD: android
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: upload
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC' -Dorg.gradle.workers.max=2"
      run: |
        gradle assembleRelease \
          -PstorePassword=android \
          -PkeyPassword=android \
          -PkeyAlias=upload \
          -PKEYSTORE_PASSWORD=android \
          -PKEY_PASSWORD=android \
          -PKEY_ALIAS=upload \
          -PRELEASE_STORE_PASSWORD=android \
          -PRELEASE_KEY_PASSWORD=android \
          -PRELEASE_KEY_ALIAS=upload

    # 3. 收集并上传生成的 Release APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
