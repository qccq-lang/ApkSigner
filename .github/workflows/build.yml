name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'
        validate-wrappers: false

    # 1. 编译未签名的 Release APK
    - name: Build Release APK
      run: gradle assembleRelease

    # 2. 自动进行 ZipAlign 和 v1/v2/v3 签名（开源标准动作）
    - name: Sign & ZipAlign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      # 如果你的 gradle 已经在 build.gradle 里配置了签名，可以删掉这个 Step 2

    # 3. 上传签名好的正式版 APK
    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        # 如果使用了上面的签名动作，路径使用 output，或者通配符匹配
        path: ${{ steps.sign_app.outputs.signedReleaseFile || 'app/build/outputs/apk/release/*-release*.apk' }}
